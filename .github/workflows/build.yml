name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Clean
        run: rm -rf build Payload output

      - name: Build app without signing
        run: |
          set +e
          xcodebuild \
            -project FreeMusicPlayer.xcodeproj \
            -scheme FreeMusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build_output.log
          echo "${PIPESTATUS[0]}" > build_exit_code.txt
        continue-on-error: true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build_output.log
          if-no-files-found: error

      - name: Fail if build failed
        if: always()
        run: |
          EXIT_CODE=$(cat build_exit_code.txt)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Build failed with exit code $EXIT_CODE"
            ERROR_LINES=$(cat build_output.log | grep -E "error:" | head -20)
            echo "$ERROR_LINES"
            # Create an issue with the error
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "{\"title\": \"Build Error - Run #${{ github.run_number }}\", \"body\": \"Exit code: $EXIT_CODE\n\n\`\`\`\n$ERROR_LINES\n\`\`\`\"}"
            exit "$EXIT_CODE"
          fi

      - name: Package IPA
        run: |
          APP_PATH=$(find build -type d -name "FreeMusicPlayer.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "FreeMusicPlayer.app not found"
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "1.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p Payload output
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "output/FreeMusicPlayer-v${VERSION}.ipa"

      - name: Show result
        run: |
          ls -la output
          file output/*.ipa || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMusicPlayer-ipa
          path: output/*.ipa
          if-no-files-found: error
